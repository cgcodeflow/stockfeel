; Stockfeel NAS 설정 — UTF-8로 저장하세요.
; EN: Stockfeel NAS configuration. Save as UTF-8.
; 변경 후 NAS 프로세스 또는 컨테이너를 재시작하세요.
; EN: Restart the server process or container after editing.
; 화면 새로고침만으로는 설정이 바뀌지 않습니다.
; EN: Refreshing the browser does not reload configuration.
; 퍼센트는 % 기호 없이 양수 입력. 예: 2 = +2% 급등 / -2% 급락.
; EN: Enter positive percentages without %. Example: 2 = surge at +2%, drop at -2%.
; 빠진 항목은 기본값 사용. 잘못된 값은 시작 시 항목명을 알려줍니다.
; EN: Missing settings use defaults. Invalid options are reported at startup.

[display]
; 표정 이미지: stockfeel_assets 폴더의 파일명 (좌→우, 위→아래 9단계 3×3 PNG)
; EN: Mood image: PNG filename in stockfeel_assets. Nine equal 3x3 cells, left to right, top to bottom.
; frog-moods-v2.png = 기존 개구리 / meme-moods-v2.png = 새 사람형 캐릭터
; EN: frog-moods-v2.png = frog; meme-moods-v2.png = original human character.
mood_image = meme-moods-v2.png
; 어떤 업종이 움직이고 있을까요: icon 또는 score
; EN: Sector trend display: icon or score.
sector_trend = icon
; 업종을 펼친 개별 종목: icon 또는 score
; EN: Individual stock trend display inside expanded sectors: icon or score.
stock_trend = score
; 개별 종목명 아래에 당일 평온/급등/급락도 표시: true / false
; EN: Show daily calm/surge/drop badges below stock names: true or false.
; false면 개별 종목의 당일 상태 배지를 숨깁니다.
; EN: When false, daily stock badges are hidden.
show_stock_daily = false

[daily]
; 지수 당일 변동 기준 (현재 제공 시세 vs 전 거래일 종가)
; EN: Daily index threshold: latest quote versus the previous session close.
index_threshold_pct = 2
; 업종 당일 변동 기준 (집계 종목 동일금액 평균)
; EN: Daily sector threshold: equal-weight average of eligible stocks.
sector_threshold_pct = 2
; 개별 종목 당일 변동 기준 (기존 Stock List의 급등락 기준 5%)
; EN: Daily stock surge/drop threshold; default 5%.
stock_threshold_pct = 5

[score_color]
; 당일 기준과 별개: 단기/중기 숫자 점수의 색상 강조 기준
; EN: Numeric score color thresholds, separate from daily badges.
; 해당 기간 수익률의 절댓값이 기준 이상이면 빨강/파랑, 미만이면 회색
; EN: Absolute period returns at or above the threshold use red/blue; smaller moves use gray.
short_threshold_pct = 5
medium_threshold_pct = 15

[trend]
; 추세 설명에서 보합으로 보는 범위: 단기 1주 / 중기 3개월
; EN: Flat trend range: short term = one week; medium term = three months.
week_neutral_pct = 1
quarter_neutral_pct = 3
; 두 기간이 모두 아래 기준 이상이면 강한 상승/하락 지속형
; EN: A strong sustained trend requires both periods to exceed their thresholds in the same direction.
strong_week_pct = 5
strong_quarter_pct = 15

[data]
; 가격 캐시 갱신 간격(초): 21600 = 6시간, 최소 300
; EN: Quote collection interval, seconds: 21600 = six hours; minimum 300.
refresh_seconds = 21600
; 구성종목 목록 갱신 간격(초): 86400 = 하루, 최소 3600
; EN: Constituent list refresh, seconds: 86400 = one day; minimum 3600.
universe_refresh_seconds = 86400

; 업종 정렬용 시가총액 갱신 간격(초): 86400 = 하루, 최소 3600
; EN: Market-cap refresh for sector sorting, seconds: 86400 = one day; minimum 3600.
market_cap_refresh_seconds = 86400

[server]
; 0.0.0.0 = NAS 외부에서 접속 가능, 127.0.0.1 = 같은 장치에서만 접속
; EN: 0.0.0.0 listens on all interfaces; 127.0.0.1 allows access only from the same machine.
host = 0.0.0.0
; Docker에서는 compose.nas.yaml의 컨테이너 포트도 맞춰주세요
; EN: In Docker, keep the container-side port in compose.nas.yaml consistent with this port.
port = 55557
; 웹 요청 처리 스레드 수 (1~64). 미국장/한국장 수집은 순차 실행됩니다.
; EN: Web request worker threads: 1-64. US/Korean collection runs sequentially.
threads = 4
; DEBUG / INFO / WARNING / ERROR / CRITICAL
; EN: Logging level: DEBUG / INFO / WARNING / ERROR / CRITICAL.
log_level = INFO

[storage]
; 상대 경로는 이 INI 파일이 있는 폴더 기준. NAS 절대 경로도 가능.
; EN: Relative cache paths are resolved from this INI folder. Absolute paths also work.
; 컨테이너에서는 이 폴더를 영구 볼륨으로 연결하세요.
; EN: Mount this folder as persistent writable storage in Docker.
cache_dir = stockfeel_nas_cache
